<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointo — Connexion (Cosmos)</title>
<link rel="stylesheet" href="../switcher.css">

<body data-version="v7-cosmos" data-screen="login">
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <header class="topbar"><div class="topbar-in"><a class="brand" href="landing.html"><span class="orb"></span>Pointo</a></div></header>
  <main class="wrap">
    <div class="card feature narrow" style="margin:40px auto;text-align:center;">
      <div class="planet" style="width:88px;height:88px;"><span class="ring"></span><span class="body"></span></div>
      <p class="eyebrow">Accès employé</p>
      <h1>Connexion</h1>
      <p style="color:var(--ink-mute);font-size:13px;margin:-8px 0 18px;">Entre tes identifiants pour puncher.</p>
      <form data-demo-form style="text-align:left;">
        <label>Nom d'utilisateur
          <input name="username" type="text" value="marie.tremblay" autocapitalize="none">
        </label>
        <label>Mot de passe
          <input name="password" type="password" value="········">
        </label>
        <button class="btn primary big" type="submit" style="margin-top:10px;">Se connecter</button>
      </form>
    </div>
  </main>
  <footer class="foot">Pointo beta · heures calculées par période de paie bi-hebdomadaire</footer>
<script src="../switcher.js"></script>
<script src="cosmos.js"></script>
<script src="../demo-form.js"></script>

</html>
